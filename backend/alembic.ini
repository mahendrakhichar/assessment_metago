# Alembic Configuration for Metago Backend
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Use the sync DATABASE_URL for Alembic (migrations run synchronously)
sqlalchemy.url = postgresql+psycopg2://metago:metago_dev@localhost:5432/metago_db

[post_write_hooks]
# No post-write hooks

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
